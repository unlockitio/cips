openapi: 3.0.3
info:
  title: Canton Network Credentials API
  version: 1.0.0-draft
  license:
    name: CC0-1.0
    url: https://creativecommons.org/publicdomain/zero/1.0/
  description: |
    Access-policy-neutral read interfaces for intrinsic Credential records, registered
    credential records, and their distinct lifecycle histories. /credentials does not
    require registration. /registered-credentials returns only identical-contract-ID
    compositions of Credential and RegisteredCredential projections, with separate
    credential and registration objects. Deployments define endpoint exposure, filtering,
    authentication, authorization, and audience. Active record retrieval is the baseline
    capability. Inactive-record retrieval and event history are optional, separately
    advertised per resource family.
    Any compatible path alias MUST preserve the operation semantics, parameter names and
    meanings, response schemas, status-code meanings, lifecycle and capability rules,
    ordering, and pagination behavior defined here. Implementations MUST document every
    exposed alias and its canonical operation mapping.
servers:
  - url: /v1
    description: Canonical API base path. /api/v1 is not normative.
security:
  - deploymentDefined: []
  - {}
paths:
  /credential-registries:
    get:
      operationId: listCredentialRegistries
      summary: Retrieve logical credential registries
      description: |
        Pages distinct registry administrator Party values from active
        CredentialRegistryFactory projections. registryId is the canonical Party string and
        equals registryAdmin. Multiple active factories for one administrator are aggregated
        into one item. Results are ordered by registryId. Offset pagination is not
        snapshot-consistent; concurrent changes can cause duplicates or omissions across pages.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: A deterministic page of logical credential registries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialRegistryPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Unavailable'
  /credential-registries/{registryId}:
    get:
      operationId: getCredentialRegistryById
      summary: Look up a logical credential registry
      parameters:
        - name: registryId
          in: path
          required: true
          description: Canonical string form of the registryAdmin Party.
          schema:
            type: string
            minLength: 1
      responses:
        '200':
          description: Matching logical credential registry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialRegistry'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
  /credential-verifications:
    post:
      operationId: verifyCredential
      summary: Verify supplied secured VC without a registry lookup
      description: |
        Submit the exact secured VC bytes. No credentialId, Canton projection or registration
        is required or inferred. VERIFIED means cryptographic proof verification under the demo
        did:key Ed25519 profile, not issuer trust or factual truth. Schema validation is independent.
        SD-JWT and COSE return INDETERMINATE, never proof success.
      requestBody:
        required: true
        content:
          application/vc+jwt:
            schema: {type: string, format: binary}
          application/vc:
            schema: {type: string, format: binary, description: 'UTF-8 JSON VC with embedded Data Integrity proof'}
          application/vc+sd-jwt:
            schema: {type: string, format: binary, description: 'Unsupported proof profile'}
          application/vc+cose:
            schema: {type: string, format: binary, description: 'Unsupported proof profile'}
      responses:
        '200':
          description: Standalone evaluation, including unsuccessful or unsupported proofs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '415':
          description: Unsupported request Content-Type.
  /credentials/{credentialId}:
    get:
      operationId: getCredentialById
      summary: Look up a credential record by exact logical ID
      description: |
        Active lookup is required. Other lifecycle scopes are available only when
        advertised by the matching credential registry item. Duplicate active records return 409.
        archived selects the latest creation offset, creation index, then contract ID descending;
        all prefers active and otherwise selects the latest archived record.
      parameters:
        - name: credentialId
          in: path
          required: true
          description: Exact logical credential ID.
          schema:
            type: string
            minLength: 1
        - $ref: '#/components/parameters/LifecycleScope'
        - $ref: '#/components/parameters/Verify'
      responses:
        '200':
          description: Matching credential record, or evaluated wrapper when verify=true. Evaluated responses carry Cache-Control no-store.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/CredentialRecord'
                  - $ref: '#/components/schemas/EvaluatedCredentialRecord'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnsupportedCapability'
        '503':
          $ref: '#/components/responses/Unavailable'
  /credentials:
    get:
      operationId: listCredentials
      summary: Retrieve credential records in bulk
      description: |
        Returns record projections only. Event history is never mixed into this response.
        Results MUST use ascending logical credential ID and contract ID as the final
        tie-breaker. Fresh requests select a PQS snapshot. nextPageToken alone continues
        by keyset; nextPageToken plus page jumps within that snapshot. Repeat all filters
        and pageSize with the token. Tokens expire and cannot cross resource families.
      parameters:
        - $ref: '#/components/parameters/LifecycleScope'
        - $ref: '#/components/parameters/NextPageToken'
        - $ref: '#/components/parameters/CreatedFrom'
        - $ref: '#/components/parameters/CreatedUntil'
        - $ref: '#/components/parameters/ArchivedFrom'
        - $ref: '#/components/parameters/ArchivedUntil'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: verify
          in: query
          description: 'Absent or false preserves pagination; true is unsupported and returns 400.'
          schema: {type: boolean, default: false}
        - name: issuer
          in: query
          description: Exact issuer filter, when advertised in supportedFilters.
          schema:
            type: string
            minLength: 1
        - name: holder
          in: query
          description: Exact holder filter, when advertised in supportedFilters.
          schema:
            type: string
            minLength: 1
        - name: credentialSubjectId
          in: query
          description: Exact present subject identifier, when advertised in supportedFilters.
          schema:
            type: string
            minLength: 1
        - name: keyPrefix
          in: query
          description: >-
            Literal claim-key prefix filter, when advertised in supportedFilters. A credential matches
            when one single credentialSubject carries a claim key with this prefix. Combined with
            credentialSubjectId, both conditions MUST hold on the same subject.
          schema:
            type: string
            minLength: 1
      responses:
        '200':
          description: A deterministic page. verify=true is unsupported (400).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialRecordPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnsupportedCapability'
        '503':
          $ref: '#/components/responses/Unavailable'
  /registered-credentials/{credentialId}:
    get:
      operationId: getRegisteredCredentialById
      summary: Look up a registered credential by exact logical ID
      description: |
        Returns only a contract with Credential and RegisteredCredential projections sharing
        the same contract ID. The response keeps credential and registration objects separate.
      parameters:
        - name: credentialId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
        - $ref: '#/components/parameters/LifecycleScope'
        - $ref: '#/components/parameters/Verify'
      responses:
        '200':
          description: Matching registered credential, or evaluated wrapper when verify=true. Evaluated responses carry Cache-Control no-store.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/RegisteredCredentialRecord'
                  - $ref: '#/components/schemas/EvaluatedRegisteredCredentialRecord'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnsupportedCapability'
        '503':
          $ref: '#/components/responses/Unavailable'
  /registered-credentials:
    get:
      operationId: listRegisteredCredentials
      summary: Retrieve registered credentials in bulk
      description: |
        Returns only identical-contract-ID compositions of Credential and RegisteredCredential
        projections with compatible creation and archive event identity, ordered by logical
        credential ID and contract ID. Fresh requests select a snapshot. nextPageToken alone
        continues by keyset; token plus page jumps within that snapshot. Repeat all filters
        and pageSize. Tokens expire and cannot cross resource families.
      parameters:
        - $ref: '#/components/parameters/LifecycleScope'
        - $ref: '#/components/parameters/NextPageToken'
        - $ref: '#/components/parameters/CreatedFrom'
        - $ref: '#/components/parameters/CreatedUntil'
        - $ref: '#/components/parameters/ArchivedFrom'
        - $ref: '#/components/parameters/ArchivedUntil'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: verify
          in: query
          description: 'Absent or false preserves pagination; true is unsupported and returns 400.'
          schema: {type: boolean, default: false}
        - name: issuer
          in: query
          schema:
            type: string
            minLength: 1
        - name: holder
          in: query
          schema:
            type: string
            minLength: 1
        - name: credentialSubjectId
          in: query
          schema:
            type: string
            minLength: 1
        - name: keyPrefix
          in: query
          description: >-
            Literal claim-key prefix filter. A credential matches when one single credentialSubject
            carries a claim key with this prefix. Combined with credentialSubjectId, both conditions
            MUST hold on the same subject.
          schema:
            type: string
            minLength: 1
        - name: registryAdmin
          in: query
          schema:
            type: string
            minLength: 1
      responses:
        '200':
          description: A deterministic page. verify=true is unsupported (400).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisteredCredentialRecordPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnsupportedCapability'
        '503':
          $ref: '#/components/responses/Unavailable'
  /credential-events:
    get:
      operationId: listCredentialEvents
      summary: Retrieve credential lifecycle or ledger events
      description: |
        Available only when eventHistory is advertised. This operation has a distinct
        schema and ordering from credential-record retrieval. Events MUST use the stable
        total ordering documented by the implementation: ascending event position with
        event ID as the final deterministic tie-breaker. occurredAt is informational and
        is not an ordering key.
      parameters:
        - name: credentialId
          in: query
          description: Optional exact logical credential ID filter; omission applies no credential-ID filter.
          schema:
            type: string
            minLength: 1
        - name: contractId
          in: query
          description: Optional exact contract ID filter; omission applies no contract-ID filter.
          schema:
            type: string
            minLength: 1
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: A deterministic event page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialEventPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnsupportedCapability'
        '503':
          $ref: '#/components/responses/Unavailable'
  /registered-credential-events:
    get:
      operationId: listRegisteredCredentialEvents
      summary: Retrieve registered-credential lifecycle or ledger events
      description: |
        Available only when registered-credential event history is advertised. Its event
        semantics and ordering are distinct from intrinsic credential history.
      parameters:
        - name: credentialId
          in: query
          schema:
            type: string
            minLength: 1
        - name: contractId
          in: query
          schema:
            type: string
            minLength: 1
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: A deterministic registered-credential event page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisteredCredentialEventPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnsupportedCapability'
        '503':
          $ref: '#/components/responses/Unavailable'
components:
  securitySchemes:
    deploymentDefined:
      type: http
      scheme: bearer
      bearerFormat: deployment-defined
      description: |
        Illustrative placeholder for a deployment-defined authentication binding. This
        standard does not require bearer authentication or define authorization policy.
        The alternative empty root requirement permits anonymous deployment; deployments
        document which alternative they apply without changing the wire schemas.
  parameters:
    Verify:
      name: verify
      in: query
      description: 'For singular record reads, absent or false returns the original record unchanged. True evaluates the stored secured document offline, returns {record, evaluation}, and marks the response no-store. Evaluation does not prove Canton ledger provenance, issuer trust, or factual truth. A Party issuer or PQS projection alone is insufficient. Unsupported/unsigned mechanisms are INDETERMINATE; schema validation is independent. Collection reads reject true with 400.'
      schema: {type: boolean, default: false}
    LifecycleScope:
      name: state
      in: query
      description: |
        Record lifecycle state. active is the default; archived and all are supported.
        lifecycleScope is a legacy alias; conflicting state and lifecycleScope values are invalid.
      schema:
        $ref: '#/components/schemas/LifecycleScope'
    NextPageToken:
      name: nextPageToken
      in: query
      description: Signed expiring continuation bound to resource, normalized filters, pageSize and snapshot. Invalid or expired tokens and unavailable snapshots return 400. With page, jump at the same snapshot; without page, continue by keyset.
      schema:
        type: string
    CreatedFrom:
      name: createdFrom
      in: query
      description: Inclusive created_effective_at lower bound.
      schema: {type: string, format: date-time}
    CreatedUntil:
      name: createdUntil
      in: query
      description: Exclusive created_effective_at upper bound; must exceed createdFrom.
      schema: {type: string, format: date-time}
    ArchivedFrom:
      name: archivedFrom
      in: query
      description: Inclusive archived_effective_at lower bound. Excludes records without an archive at the snapshot.
      schema: {type: string, format: date-time}
    ArchivedUntil:
      name: archivedUntil
      in: query
      description: Exclusive archived_effective_at upper bound; must exceed archivedFrom.
      schema: {type: string, format: date-time}
    Page:
      name: page
      in: query
      description: Zero-based page number. The offset is page multiplied by pageSize.
      schema:
        type: integer
        format: int64
        minimum: 0
        default: 0
    PageSize:
      name: pageSize
      in: query
      description: |
        Positive page size. The implementation reads at most pageSize plus one matching
        item; the extra item determines hasNext and is not returned.
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
        default: 50
  responses:
    BadRequest:
      description: Invalid pagination, lifecycle scope, filter, or other request value.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Authentication is required by deployment policy and was not satisfied.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Deployment policy does not authorize the caller for this operation or record.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: No matching record is exposed in the requested lifecycle scope.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Exact lookup found duplicate logical credential IDs in the requested scope.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnsupportedCapability:
      description: The requested lifecycle scope, history operation, or filter is not advertised.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unavailable:
      description: The configured record or history backing is unavailable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    CredentialRegistry:
      type: object
      required:
        - registryId
        - apiVersion
        - credentials
        - registeredCredentials
        - issuanceFactories
      properties:
        registryId:
          type: string
          minLength: 1
          description: Canonical string form of registryAdmin; registryId equals registryAdmin.
        apiVersion:
          type: string
          example: 1.0.0-draft
        credentials:
          $ref: '#/components/schemas/FamilyCapabilities'
        registeredCredentials:
          $ref: '#/components/schemas/FamilyCapabilities'
        issuanceFactories:
          type: array
          description: Active subordinate factories ordered by contractId.
          items:
            $ref: '#/components/schemas/IssuanceFactoryReference'
    IssuanceFactoryReference:
      type: object
      required:
        - contractId
        - anchorers
      properties:
        contractId:
          type: string
          minLength: 1
        anchorers:
          $ref: '#/components/schemas/Anchorers'
    Anchorers:
      type: object
      required: [hd, tl]
      description: NonEmpty Canton Party list in Daml JSON encoding. The head and tail MUST be unique across the entire list; implementations enforce this cross-field invariant at runtime. tl.uniqueItems checks only duplicates within the tail.
      properties:
        hd:
          type: string
          minLength: 1
        tl:
          type: array
          uniqueItems: true
          items:
            type: string
    CredentialRegistryPage:
      type: object
      required:
        - items
        - page
        - pageSize
        - hasNext
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CredentialRegistry'
        page:
          type: integer
          format: int64
          minimum: 0
        pageSize:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
        hasNext:
          type: boolean
    FamilyCapabilities:
      type: object
      required:
        - activeRecords
        - inactiveRecords
        - eventHistory
        - supportedLifecycleScopes
        - supportedFilters
        - defaultPageSize
        - maximumPageSize
      properties:
        activeRecords:
          type: boolean
          enum: [true]
        inactiveRecords:
          type: boolean
        eventHistory:
          type: boolean
        supportedLifecycleScopes:
          type: array
          items:
            $ref: '#/components/schemas/LifecycleScope'
        supportedFilters:
          type: array
          items:
            type: string
        defaultPageSize:
          type: integer
          minimum: 1
        maximumPageSize:
          type: integer
          minimum: 1

    LifecycleScope:
      type: string
      description: |
        active returns contracts active at the snapshot; archived returns archived contracts;
        all returns both. Singular archived lookup selects the latest creation position;
        singular all prefers active then latest archived. Duplicate active matches return 409.
      enum:
        - active
        - archived
        - all
      default: active
    LifecycleState:
      type: string
      enum:
        - active
        - archived
    LifecycleMetadata:
      type: object
      description: PQS lifecycle metadata at the selected snapshot. Composite event IDs use JDBC text representation. Archive fields are null for active contracts.
      properties:
        state: {type: string, enum: [active, archived]}
        templateFqn: {type: string}
        payloadType: {type: string}
        createEventPk: {type: integer, format: int64}
        createEventId: {type: string}
        createdAtIx: {type: integer, format: int64}
        createdAtOffset: {type: integer, format: int64}
        createdEffectiveAt: {type: string, format: date-time}
        archiveEventPk: {type: integer, format: int64, nullable: true}
        archiveEventId: {type: string, nullable: true}
        archivedAtIx: {type: integer, format: int64, nullable: true}
        archivedAtOffset: {type: integer, format: int64, nullable: true}
        archivedEffectiveAt: {type: string, format: date-time, nullable: true}
    CredentialRecord:
      type: object
      example:
        contractId: 'example-contract'
        credentialId: 'urn:demo:scenario:external-did'
        lifecycleState: active
        credential:
          '@context': {'@protected': true, id: '@id', type: '@type', EnvelopedVerifiableCredential: 'https://www.w3.org/2018/credentials#EnvelopedVerifiableCredential'}
          id: 'data:application/vc+jwt,<exact-compact-jws>'
          type: EnvelopedVerifiableCredential
        canton: {holders: [], anchorers: ['example-anchorer']}
      required:
        - contractId
        - credentialId
        - lifecycleState
        - credential
        - canton
      properties:
        contractId:
          type: string
          minLength: 1
        credentialId:
          type: string
          minLength: 1
        lifecycleState:
          $ref: '#/components/schemas/LifecycleState'
        lifecycle:
          $ref: '#/components/schemas/LifecycleMetadata'
        credential:
          $ref: '#/components/schemas/SecuredOrUnsecuredCredential'
        canton:
          $ref: '#/components/schemas/CantonCredentialRoles'
    CantonCredentialRoles:
      type: object
      description: Non-VC envelope metadata. Party identifiers are ordinary strings, not inferred DIDs.
      required: [holders, anchorers]
      properties:
        holders:
          type: array
          uniqueItems: true
          items: {type: string}
        anchorers:
          type: array
          minItems: 1
          uniqueItems: true
          items: {type: string}
    SecuredOrUnsecuredCredential:
      description: Enveloped VC, stored embedded secured JSON, or unsecured VC2-shaped index. Optional explicit verify=true on record reads evaluates the stored secured bytes; standalone verification accepts supplied bytes.
      oneOf:
        - $ref: '#/components/schemas/CredentialView'
        - $ref: '#/components/schemas/EnvelopedCredential'
        - $ref: '#/components/schemas/EmbeddedCredential'
    EnvelopedCredential:
      type: object
      required: ['@context', id, type]
      properties:
        '@context':
          type: object
          description: Local context defining id as @id, type as @type and EnvelopedVerifiableCredential as the W3C term.
          additionalProperties: true
        id:
          type: string
          description: data URI containing the exact stored compact secured credential without normalization.
        type:
          type: string
          enum: [EnvelopedVerifiableCredential]
    EmbeddedCredential:
      type: object
      required: ['@context', id, type, issuer, credentialSubject, proof]
      properties:
        '@context': {type: array, items: {type: string}}
        id: {type: string}
        type: {type: array, items: {type: string}}
        issuer: {type: string}
        credentialSubject: {type: array, items: {type: object}}
        credentialSchema: {type: array, items: {$ref: '#/components/schemas/CredentialSchema'}}
        proof:
          type: object
          additionalProperties: true
          description: Original stored proof; never reconstructed from the Daml proof summary.
      additionalProperties: true
    CredentialSchema:
      type: object
      required: [id, type]
      properties:
        id: {type: string}
        type: {type: string}
        digestSRI: {type: string}
    VerificationResult:
      type: object
      required: [mechanism, status, verifiedAt, errors, warnings, schemaValidation]
      properties:
        mechanism: {type: string, description: 'Securing media type, cryptosuite, or unsecured.'}
        status: {type: string, enum: [VERIFIED, FAILED, INDETERMINATE]}
        verifiedAt: {type: string, format: date-time, description: 'Evaluation timestamp, including unsuccessful evaluations.'}
        controller: {type: string, nullable: true, description: 'Locally resolved did:key controller, when supported.'}
        errors: {type: array, items: {type: string}}
        warnings: {type: array, items: {type: string}}
        schemaValidation:
          type: object
          required: [status, errors]
          properties:
            status: {type: string, enum: [Success, Failure, Indeterminate]}
            errors: {type: array, items: {type: string}}
      description: 'Standalone demo proof evaluation: EdDSA vc+jwt and eddsa-jcs-2022 with did:key only. VERIFIED indicates cryptographic verification, not issuer trust or factual truth. Unsupported mechanisms and unresolved controllers are INDETERMINATE; invalid signatures or expired validity are FAILED. Schema validation is independent and local only. No registry lookup, remote DID/schema retrieval or JSON-LD processing.'
    EvaluatedCredentialRecord:
      type: object
      required: [record, evaluation]
      properties:
        record: {$ref: '#/components/schemas/CredentialRecord'}
        evaluation: {$ref: '#/components/schemas/VerificationResult'}
    EvaluatedRegisteredCredentialRecord:
      type: object
      required: [record, evaluation]
      properties:
        record: {$ref: '#/components/schemas/RegisteredCredentialRecord'}
        evaluation: {$ref: '#/components/schemas/VerificationResult'}
    CredentialView:
      type: object
      description: Unsecured VC Data Model 2.0-shaped index, not a verified or fully conforming VC. No proof, credentialStatus or JSON-LD processing is implied. Daml/PQS remains LF-tagged.
      required: ['@context', type, issuer, credentialSubject]
      properties:
        '@context':
          type: array
          minItems: 1
          description: The first entry is the VC Data Model 2.0 context.
          items: {type: string}
        id:
          type: string
          description: Optional logical credential ID from CredentialView.id; omitted when absent, never synthesized from other roles. CredentialRecord.credentialId is a separate lookup key.
        type:
          type: array
          minItems: 1
          description: Direct mapping of credentialTypes; MUST contain VerifiableCredential. Invalid input fails closed.
          items: {type: string}
        issuer:
          type: string
          description: Direct Party string or textual identifier. A bare Party is not asserted to be a URL or DID.
        validFrom:
          type: string
          format: date-time
          description: Intrinsic start, omitted when absent.
        validUntil:
          type: string
          format: date-time
          description: Intrinsic end, omitted when absent; independent of registry retention.
        credentialSubject:
          type: array
          minItems: 1
          description: Subject ID is omitted when absent; claims flatten into properties. Reserved id, type and @context claim keys are rejected.
          items:
            type: object
            additionalProperties: true
        credentialSchema:
          type: array
          items:
            $ref: '#/components/schemas/CredentialSchema'
    RegisteredCredentialRecord:
      type: object
      example:
        contractId: 'example-contract'
        credentialId: 'urn:demo:scenario:external-holderless'
        lifecycleState: active
        credential:
          '@context': ['https://www.w3.org/ns/credentials/v2']
          id: 'urn:demo:scenario:external-holderless'
          type: [VerifiableCredential, AchievementCredential]
          issuer: 'did:key:zExample'
          credentialSubject: [{achievement: {type: CourseCertificate, score: 85}}]
          proof: {type: DataIntegrityProof, cryptosuite: eddsa-jcs-2022, proofValue: 'zExamplePlaceholder'}
        registration: {registryAdmin: 'example-admin', registeredAt: '2026-09-18T00:00:00Z', expiresAt: null, meta: {}}
        canton: {holders: [], anchorers: ['example-anchorer']}
      required:
        - contractId
        - credentialId
        - lifecycleState
        - credential

        - registration
        - canton
      properties:
        contractId:
          type: string
          minLength: 1
        credentialId:
          type: string
          minLength: 1
        lifecycleState:
          $ref: '#/components/schemas/LifecycleState'
        lifecycle:
          $ref: '#/components/schemas/LifecycleMetadata'
        credential:
          $ref: '#/components/schemas/SecuredOrUnsecuredCredential'
        canton:
          $ref: '#/components/schemas/CantonCredentialRoles'
        registration:
          type: object
          required:
            - registryAdmin
            - registeredAt
            - expiresAt
            - meta
          properties:
            registryAdmin:
              type: string
            registeredAt:
              type: string
              format: date-time
            expiresAt:
              type: string
              format: date-time
              nullable: true
              description: Registry-retention expiry, distinct from credential.validUntil.
            meta:
              type: object
              additionalProperties: true
          description: Registration projection fields from the matching RegisteredCredential contract ID.
    CredentialRecordPage:
      type: object
      description: pageSize equals the supplied request value, or the matching credential registry item's defaultPageSize when omitted, and never exceeds maximumPageSize.
      required:
        - items
        - page
        - pageSize
        - hasNext
        - snapshotOffset
        - nextPageToken
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CredentialRecord'
        snapshotOffset:
          type: string
          description: Decimal bigint PQS snapshot offset, encoded without precision loss.
        nextPageToken:
          type: string
          nullable: true
          description: Continuation token, null when hasNext is false.
        page:
          type: integer
          format: int64
          minimum: 0
        pageSize:
          type: integer
          format: int32
          minimum: 1
        hasNext:
          type: boolean
    RegisteredCredentialRecordPage:
      type: object
      description: pageSize equals the supplied request value, or the matching credential registry item's defaultPageSize when omitted, and never exceeds maximumPageSize.
      required:
        - items
        - page
        - pageSize
        - hasNext
        - snapshotOffset
        - nextPageToken
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RegisteredCredentialRecord'
        snapshotOffset:
          type: string
          description: Decimal bigint PQS snapshot offset, encoded without precision loss.
        nextPageToken:
          type: string
          nullable: true
          description: Continuation token, null when hasNext is false.
        page:
          type: integer
          format: int64
          minimum: 0
        pageSize:
          type: integer
          format: int32
          minimum: 1
        hasNext:
          type: boolean
    CredentialEvent:
      type: object
      required:
        - eventId
        - position
        - eventType
        - credentialId
        - contractId
        - occurredAt
      properties:
        eventId:
          type: string
          minLength: 1
        position:
          type: string
          minLength: 1
          description: Opaque event position with implementation-documented stable comparison semantics.
        eventType:
          type: string
          minLength: 1
          description: Implementation-documented credential lifecycle or ledger event type.
        credentialId:
          type: string
          minLength: 1
        contractId:
          type: string
          minLength: 1
        occurredAt:
          type: string
          format: date-time
        payload:
          type: object
          additionalProperties: true
          nullable: true
    RegisteredCredentialEventPage:
      $ref: '#/components/schemas/CredentialEventPage'
    CredentialEventPage:
      type: object
      description: pageSize equals the supplied request value, or the matching credential registry item's defaultPageSize when omitted, and never exceeds maximumPageSize.
      required:
        - items
        - page
        - pageSize
        - hasNext
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CredentialEvent'
        page:
          type: integer
          format: int64
          minimum: 0
        pageSize:
          type: integer
          format: int32
          minimum: 1
        hasNext:
          type: boolean
    Error:
      type: object
