openapi: 3.0.3
info:
  title: Canton Network Credentials API
  version: 1.0.0-draft
  license:
    name: CC0-1.0
    url: https://creativecommons.org/publicdomain/zero/1.0/
  description: |
    Access-policy-neutral read interfaces for intrinsic Credential records, registered
    credential records, and their distinct lifecycle histories. /credentials does not
    require registration. /registered-credentials returns only identical-contract-ID
    compositions of Credential and RegisteredCredential projections, with separate
    credential and registration objects. Deployments define endpoint exposure, filtering,
    authentication, authorization, and audience. Active record retrieval is the baseline
    capability. Inactive-record retrieval and event history are optional, separately
    advertised per resource family.
    Any compatible path alias MUST preserve the operation semantics, parameter names and
    meanings, response schemas, status-code meanings, lifecycle and capability rules,
    ordering, and pagination behavior defined here. Implementations MUST document every
    exposed alias and its canonical operation mapping.
servers:
  - url: /v1
    description: Canonical API base path. /api/v1 is not normative.
security:
  - deploymentDefined: []
  - {}
paths:
  /registry-info:
    get:
      operationId: getRegistryInfo
      summary: Get registry capabilities and limits
      responses:
        '200':
          description: Registry information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistryInfo'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Unavailable'
  /credentials/{credentialId}:
    get:
      operationId: getCredentialById
      summary: Look up a credential record by exact logical ID
      description: |
        Active lookup is required. Other lifecycle scopes are available only when
        advertised by Registry Info. Duplicate records in the requested scope are a conflict.
      parameters:
        - name: credentialId
          in: path
          required: true
          description: Exact logical credential ID.
          schema:
            type: string
            minLength: 1
        - $ref: '#/components/parameters/LifecycleScope'
      responses:
        '200':
          description: Matching credential record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialRecord'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnsupportedCapability'
        '503':
          $ref: '#/components/responses/Unavailable'
  /credentials:
    get:
      operationId: listCredentials
      summary: Retrieve credential records in bulk
      description: |
        Returns record projections only. Event history is never mixed into this response.
        Results MUST use ascending logical credential ID and contract ID as the final
        tie-breaker. Pagination is offset-based and is not snapshot-consistent; concurrent
        updates can cause duplicates or omissions across pages.
      parameters:
        - $ref: '#/components/parameters/LifecycleScope'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: issuer
          in: query
          description: Exact issuer filter, when advertised in supportedFilters.
          schema:
            type: string
            minLength: 1
        - name: holder
          in: query
          description: Exact holder filter, when advertised in supportedFilters.
          schema:
            type: string
            minLength: 1
        - name: credentialSubjectId
          in: query
          description: Exact present subject identifier, when advertised in supportedFilters.
          schema:
            type: string
            minLength: 1
        - name: keyPrefix
          in: query
          description: Claim-key prefix filter, when advertised in supportedFilters.
          schema:
            type: string
            minLength: 1
      responses:
        '200':
          description: A deterministic page ordered by logical credential ID and contract ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialRecordPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnsupportedCapability'
        '503':
          $ref: '#/components/responses/Unavailable'
  /registered-credentials/{credentialId}:
    get:
      operationId: getRegisteredCredentialById
      summary: Look up a registered credential by exact logical ID
      description: |
        Returns only a contract with Credential and RegisteredCredential projections sharing
        the same contract ID. The response keeps credential and registration objects separate.
      parameters:
        - name: credentialId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
        - $ref: '#/components/parameters/LifecycleScope'
      responses:
        '200':
          description: Matching registered credential
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisteredCredentialRecord'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnsupportedCapability'
        '503':
          $ref: '#/components/responses/Unavailable'
  /registered-credentials:
    get:
      operationId: listRegisteredCredentials
      summary: Retrieve registered credentials in bulk
      description: |
        Returns only identical-contract-ID compositions of Credential and RegisteredCredential
        projections, ordered by logical credential ID and contract ID.
      parameters:
        - $ref: '#/components/parameters/LifecycleScope'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: issuer
          in: query
          schema:
            type: string
            minLength: 1
        - name: holder
          in: query
          schema:
            type: string
            minLength: 1
        - name: credentialSubjectId
          in: query
          schema:
            type: string
            minLength: 1
        - name: keyPrefix
          in: query
          schema:
            type: string
            minLength: 1
        - name: registryAdmin
          in: query
          schema:
            type: string
            minLength: 1
      responses:
        '200':
          description: A deterministic page of registered credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisteredCredentialRecordPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnsupportedCapability'
        '503':
          $ref: '#/components/responses/Unavailable'
  /credential-events:
    get:
      operationId: listCredentialEvents
      summary: Retrieve credential lifecycle or ledger events
      description: |
        Available only when eventHistory is advertised. This operation has a distinct
        schema and ordering from credential-record retrieval. Events MUST use the stable
        total ordering documented by the implementation: ascending event position with
        event ID as the final deterministic tie-breaker. occurredAt is informational and
        is not an ordering key.
      parameters:
        - name: credentialId
          in: query
          description: Optional exact logical credential ID filter; omission applies no credential-ID filter.
          schema:
            type: string
            minLength: 1
        - name: contractId
          in: query
          description: Optional exact contract ID filter; omission applies no contract-ID filter.
          schema:
            type: string
            minLength: 1
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: A deterministic event page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialEventPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnsupportedCapability'
        '503':
          $ref: '#/components/responses/Unavailable'
  /registered-credential-events:
    get:
      operationId: listRegisteredCredentialEvents
      summary: Retrieve registered-credential lifecycle or ledger events
      description: |
        Available only when registered-credential event history is advertised. Its event
        semantics and ordering are distinct from intrinsic credential history.
      parameters:
        - name: credentialId
          in: query
          schema:
            type: string
            minLength: 1
        - name: contractId
          in: query
          schema:
            type: string
            minLength: 1
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: A deterministic registered-credential event page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisteredCredentialEventPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnsupportedCapability'
        '503':
          $ref: '#/components/responses/Unavailable'
components:
  securitySchemes:
    deploymentDefined:
      type: http
      scheme: bearer
      bearerFormat: deployment-defined
      description: |
        Illustrative placeholder for a deployment-defined authentication binding. This
        standard does not require bearer authentication or define authorization policy.
        The alternative empty root requirement permits anonymous deployment; deployments
        document which alternative they apply without changing the wire schemas.
  parameters:
    LifecycleScope:
      name: lifecycleScope
      in: query
      description: |
        Record lifecycle scope. active is mandatory. inactive and all require the
        inactiveRecords capability and implementation-specific documented backing.
      schema:
        $ref: '#/components/schemas/LifecycleScope'
    Page:
      name: page
      in: query
      description: Zero-based page number. The offset is page multiplied by pageSize.
      schema:
        type: integer
        format: int64
        minimum: 0
        default: 0
    PageSize:
      name: pageSize
      in: query
      description: |
        Positive page size. The implementation reads at most pageSize plus one matching
        item; the extra item determines hasNext and is not returned.
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
        default: 50
  responses:
    BadRequest:
      description: Invalid pagination, lifecycle scope, filter, or other request value.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Authentication is required by deployment policy and was not satisfied.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Deployment policy does not authorize the caller for this operation or record.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: No matching record is exposed in the requested lifecycle scope.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Exact lookup found duplicate logical credential IDs in the requested scope.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnsupportedCapability:
      description: The requested lifecycle scope, history operation, or filter is not advertised.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unavailable:
      description: The configured record or history backing is unavailable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    RegistryInfo:
      type: object
      required:
        - apiVersion
        - credentials
        - registeredCredentials
      properties:
        apiVersion:
          type: string
          example: 1.0.0-draft
        credentials:
          $ref: '#/components/schemas/FamilyCapabilities'
        registeredCredentials:
          $ref: '#/components/schemas/FamilyCapabilities'
    FamilyCapabilities:
      type: object
      required:
        - activeRecords
        - inactiveRecords
        - eventHistory
        - supportedLifecycleScopes
        - supportedFilters
        - defaultPageSize
        - maximumPageSize
      properties:
        activeRecords:
          type: boolean
          enum: [true]
        inactiveRecords:
          type: boolean
        eventHistory:
          type: boolean
        supportedLifecycleScopes:
          type: array
          items:
            $ref: '#/components/schemas/LifecycleScope'
        supportedFilters:
          type: array
          items:
            type: string
        defaultPageSize:
          type: integer
          minimum: 1
        maximumPageSize:
          type: integer
          minimum: 1

    LifecycleScope:
      type: string
      description: |
        active returns active records only. inactive returns inactive and archived records.
        all returns active, inactive, and archived records. Every returned record uses the
        corresponding LifecycleState value.
      enum:
        - active
        - inactive
        - all
      default: active
    LifecycleState:
      type: string
      enum:
        - active
        - inactive
        - archived
    CredentialRecord:
      type: object
      required:
        - contractId
        - credentialId
        - lifecycleState
        - credential
      properties:
        contractId:
          type: string
          minLength: 1
        credentialId:
          type: string
          minLength: 1
        lifecycleState:
          $ref: '#/components/schemas/LifecycleState'
        credential:
          $ref: '#/components/schemas/CredentialView'
    CredentialView:
      type: object
      required:
        - id
        - credentialTypes
        - issuer
        - validFrom
        - validUntil
        - credentialSubject
        - holders
      properties:
        id:
          type: string
          nullable: true
        credentialTypes:
          type: array
          items:
            type: string
        issuer:
          type: object
          additionalProperties: true
        validFrom:
          type: string
          format: date-time
          nullable: true
        validUntil:
          type: string
          format: date-time
          nullable: true
          description: Intrinsic semantic end of validity, independent of registry retention.
        credentialSubject:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: true
        holders:
          type: array
          minItems: 1
          items:
            type: string
    RegisteredCredentialRecord:
      type: object
      required:
        - contractId
        - credentialId
        - lifecycleState
        - credential
        - registration
      properties:
        contractId:
          type: string
          minLength: 1
        credentialId:
          type: string
          minLength: 1
        lifecycleState:
          $ref: '#/components/schemas/LifecycleState'
        credential:
          $ref: '#/components/schemas/CredentialView'
        registration:
          type: object
          required:
            - registryAdmin
            - registeredAt
            - expiresAt
            - meta
          properties:
            registryAdmin:
              type: string
            registeredAt:
              type: string
              format: date-time
            expiresAt:
              type: string
              format: date-time
              nullable: true
              description: Registry-retention expiry, distinct from credential.validUntil.
            meta:
              type: object
              additionalProperties: true
          description: Registration projection fields from the matching RegisteredCredential contract ID.
    CredentialRecordPage:
      type: object
      description: pageSize equals the supplied request value, or Registry Info's defaultPageSize when omitted, and never exceeds maximumPageSize.
      required:
        - items
        - page
        - pageSize
        - hasNext
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CredentialRecord'
        page:
          type: integer
          format: int64
          minimum: 0
        pageSize:
          type: integer
          format: int32
          minimum: 1
        hasNext:
          type: boolean
    RegisteredCredentialRecordPage:
      type: object
      description: pageSize equals the supplied request value, or Registry Info's defaultPageSize when omitted, and never exceeds maximumPageSize.
      required:
        - items
        - page
        - pageSize
        - hasNext
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RegisteredCredentialRecord'
        page:
          type: integer
          format: int64
          minimum: 0
        pageSize:
          type: integer
          format: int32
          minimum: 1
        hasNext:
          type: boolean
    CredentialEvent:
      type: object
      required:
        - eventId
        - position
        - eventType
        - credentialId
        - contractId
        - occurredAt
      properties:
        eventId:
          type: string
          minLength: 1
        position:
          type: string
          minLength: 1
          description: Opaque event position with implementation-documented stable comparison semantics.
        eventType:
          type: string
          minLength: 1
          description: Implementation-documented credential lifecycle or ledger event type.
        credentialId:
          type: string
          minLength: 1
        contractId:
          type: string
          minLength: 1
        occurredAt:
          type: string
          format: date-time
        payload:
          type: object
          additionalProperties: true
          nullable: true
    RegisteredCredentialEventPage:
      $ref: '#/components/schemas/CredentialEventPage'
    CredentialEventPage:
      type: object
      description: pageSize equals the supplied request value, or Registry Info's defaultPageSize when omitted, and never exceeds maximumPageSize.
      required:
        - items
        - page
        - pageSize
        - hasNext
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CredentialEvent'
        page:
          type: integer
          format: int64
          minimum: 0
        pageSize:
          type: integer
          format: int32
          minimum: 1
        hasNext:
          type: boolean
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: string
        code:
          type: string
          description: Optional stable implementation error code.
