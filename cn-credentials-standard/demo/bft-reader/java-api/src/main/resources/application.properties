quarkus.application.name=credential-bft-reader-demo
quarkus.http.host=0.0.0.0
quarkus.http.port=${CREDENTIAL_BFT_HTTP_PORT:8080}
credential.bft.origins=${CREDENTIAL_BFT_ORIGINS:http://credential-api-1:8080,http://credential-api-2:8080,http://credential-api-3:8080,http://credential-api-4:8080}
credential.bft.connect-timeout=${CREDENTIAL_BFT_CONNECT_TIMEOUT:2s}
credential.bft.read-timeout=${CREDENTIAL_BFT_READ_TIMEOUT:2s}
credential.bft.operation-timeout=${CREDENTIAL_BFT_OPERATION_TIMEOUT:3s}
credential.bft.max-body-bytes=${CREDENTIAL_BFT_MAX_BODY_BYTES:1048576}
%test.quarkus.http.test-port=0
