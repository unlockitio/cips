quarkus.application.name=did-resolver-demo
quarkus.http.host=0.0.0.0
quarkus.http.port=${DID_HTTP_PORT:8080}
did.api.instance-id=${DID_API_INSTANCE_ID:did-api-1}
did.listing.hmac-secret=${DID_LISTING_HMAC_SECRET}
did.listing.token-ttl-seconds=${DID_LISTING_TOKEN_TTL_SECONDS:900}
did.bootstrap.dso-did=${DID_BOOTSTRAP_DSO_DID:}
%test.did.listing.hmac-secret=component-test-only-secret-32-bytes-minimum
quarkus.smallrye-health.include-problem-details=true
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${PQS_JDBC_URL:jdbc:postgresql://localhost:5432/pqs}
quarkus.datasource.username=${PQS_DB_USER:pqs}
quarkus.datasource.password=${PQS_DB_PASSWORD:pqs-demo}
quarkus.datasource.jdbc.max-size=4
quarkus.datasource.jdbc.initial-size=0
quarkus.datasource.health.enabled=false
did.demo.faults.enabled=${DID_DEMO_FAULTS_ENABLED:false}
did.demo.faults.mode=${DID_DEMO_FAULT_MODE:normal}
did.demo.faults.family=${DID_DEMO_FAULT_FAMILY:all}
did.demo.faults.delay=${DID_DEMO_FAULT_DELAY:4s}

%test.quarkus.http.test-port=0
%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:dids;DB_CLOSE_DELAY=-1
%test.quarkus.datasource.username=sa
%test.quarkus.datasource.password=
%test.quarkus.datasource.health.enabled=false
