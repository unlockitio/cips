quarkus.application.name=bft-reader-demo
quarkus.http.host=0.0.0.0
quarkus.http.port=${BFT_READER_HTTP_PORT:8080}
quarkus.smallrye-health.include-problem-details=true
bft.reader.registry-url=${BFT_DID_REGISTRY_URL:http://did-api-1:8080/v1/dids/dso}
bft.reader.connect-timeout=${BFT_CONNECT_TIMEOUT:2s}
bft.reader.read-timeout=${BFT_READ_TIMEOUT:2s}
bft.reader.operation-timeout=${BFT_OPERATION_TIMEOUT:3s}
bft.reader.max-body-bytes=${BFT_MAX_BODY_BYTES:1048576}
bft.reader.origin-map=${BFT_ORIGIN_MAP:localhost:42003=http://did-api-1:8080,localhost:42004=http://did-api-2:8080,localhost:42005=http://did-api-3:8080,localhost:42006=http://did-api-4:8080}

%test.quarkus.http.test-port=0
%test.bft.reader.registry-url=http://localhost:1/v1/dids/dso
