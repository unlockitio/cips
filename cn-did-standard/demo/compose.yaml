name: cn-did-demo

services:
  did-artifacts:
    build:
      context: ../..
      dockerfile: cn-did-standard/Dockerfile.daml
      target: artifacts
    entrypoint: ["/bin/cp"]
    command:
      - /artifacts/canton-network-did-interfaces-0.1.0.dar
      - /artifacts/canton-network-did-demo-0.1.0.dar
      - /artifacts/canton-network-did-demo-scripts-0.1.0.dar
      - /out/
    volumes:
      - did-artifacts:/out
    networks:
      - did-network
    restart: "no"

  did-postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pqs}
      POSTGRES_USER: ${POSTGRES_USER:-pqs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pqs-demo}
    ports:
      - "${POSTGRES_PORT:-25432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - did-postgres-data:/var/lib/postgresql
    networks:
      - did-network

  did-canton:
    build:
      context: ..
      dockerfile: Dockerfile.canton
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:7575/v2/state/connected-synchronizers | grep -q '\"synchronizerAlias\":\"did-synchronizer\"'"]
      interval: 3s
      timeout: 5s
      retries: 60
    ports:
      - "${LEDGER_PORT:-42000}:6865"
      - "${CANTON_HTTP_PORT:-42001}:7575"
    networks:
      - did-network

  did-dar-upload:
    build:
      context: ../..
      dockerfile: cn-did-standard/Dockerfile.daml
      target: tools
    working_dir: /workspace
    command: ["/workspace/scripts/upload-dars.sh"]
    environment:
      JSON_API_URL: http://did-canton:7575
      UPLOAD_TIMEOUT_SECONDS: ${UPLOAD_TIMEOUT_SECONDS:-240}
    volumes:
      - did-artifacts:/artifacts:ro
      - ./scripts:/workspace/scripts:ro
    depends_on:
      did-artifacts:
        condition: service_completed_successfully
      did-canton:
        condition: service_healthy
    networks:
      - did-network
    restart: "no"

  did-seed:
    build:
      context: ../..
      dockerfile: cn-did-standard/Dockerfile.daml
      target: tools
    working_dir: /workspace
    command: ["/workspace/scripts/seed.sh"]
    environment:
      LEDGER_HOST: did-canton
      LEDGER_PORT: "6865"
      SEED_TIMEOUT_SECONDS: ${SEED_TIMEOUT_SECONDS:-300}
      READINESS_TIMEOUT_SECONDS: ${READINESS_TIMEOUT_SECONDS:-600}
    volumes:
      - did-artifacts:/artifacts:ro
      - ./scripts:/workspace/scripts:ro
    depends_on:
      did-dar-upload:
        condition: service_completed_successfully
    networks:
      - did-network
    restart: "no"

  did-pqs:
    image: europe-docker.pkg.dev/da-images/public/docker/participant-query-store:3.5.8
    command: ["pipeline", "ledger", "postgres-document"]
    environment:
      SCRIBE_SOURCE_LEDGER_HOST: did-canton
      SCRIBE_SOURCE_LEDGER_PORT: "6865"
      SCRIBE_SOURCE_LEDGER_AUTH: NoAuth
      SCRIBE_SOURCE_LEDGER_USER: participant_admin
      SCRIBE_PIPELINE_LEDGER_START: Genesis
      SCRIBE_PIPELINE_FILTER_PARTIES: "*"
      SCRIBE_PIPELINE_FILTER_CONTRACTS: "*"
      SCRIBE_PIPELINE_FILTER_METADATA: "*"
      SCRIBE_TARGET_POSTGRES_HOST: did-postgres
      SCRIBE_TARGET_POSTGRES_PORT: "5432"
      SCRIBE_TARGET_POSTGRES_DATABASE: ${POSTGRES_DB:-pqs}
      SCRIBE_TARGET_POSTGRES_USERNAME: ${POSTGRES_USER:-pqs}
      SCRIBE_TARGET_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pqs-demo}
      SCRIBE_HEALTH_ADDRESS: 0.0.0.0
      SCRIBE_HEALTH_PORT: "8080"
    healthcheck:
      test: ["CMD", "/busybox", "wget", "--spider", "-q", "-T", "3", "http://localhost:8080/livez"]
      interval: 3s
      timeout: 5s
      retries: 30
    volumes:
      - ./tools/busybox:/busybox:ro
    depends_on:
      did-postgres:
        condition: service_healthy
      did-seed:
        condition: service_completed_successfully
    ports:
      - "${PQS_HEALTH_PORT:-42002}:8080"
    networks:
      - did-network

  did-projection-waiter:
    image: postgres:18.6-alpine
    entrypoint: ["/workspace/scripts/wait-for-projections.sh"]
    environment:
      PGHOST: did-postgres
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:-pqs}
      PGUSER: ${POSTGRES_USER:-pqs}
      PGPASSWORD: ${POSTGRES_PASSWORD:-pqs-demo}
      DID_SEED_COUNT: ${DID_SEED_COUNT:-1}
      PROJECTION_TIMEOUT_SECONDS: ${PROJECTION_TIMEOUT_SECONDS:-300}
    volumes:
      - ./scripts:/workspace/scripts:ro
    depends_on:
      did-postgres:
        condition: service_healthy
      did-pqs:
        condition: service_healthy
    networks:
      - did-network
    restart: "no"

  did-api-1: &did-api
    build: ./java-api
    environment:
      DID_HTTP_PORT: "8080"
      DID_LISTING_HMAC_SECRET: ${DID_LISTING_HMAC_SECRET:-local-demo-only-hmac-secret-change-before-deployment}
      DID_LISTING_TOKEN_TTL_SECONDS: ${DID_LISTING_TOKEN_TTL_SECONDS:-900}
      DID_BOOTSTRAP_DSO_DID: ${DID_BOOTSTRAP_DSO_DID:-}
      DID_API_INSTANCE_ID: did-api-1
      PQS_JDBC_URL: jdbc:postgresql://did-postgres:5432/${POSTGRES_DB:-pqs}
      PQS_DB_USER: ${POSTGRES_USER:-pqs}
      PQS_DB_PASSWORD: ${POSTGRES_PASSWORD:-pqs-demo}
    depends_on:
      did-projection-waiter:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/q/health/ready"]
      interval: 3s
      timeout: 3s
      retries: 40
    ports:
      - "${DID_API_1_PORT:-42003}:8080"
    networks:
      - did-network

  did-api-2:
    <<: *did-api
    environment:
      DID_HTTP_PORT: "8080"
      DID_LISTING_HMAC_SECRET: ${DID_LISTING_HMAC_SECRET:-local-demo-only-hmac-secret-change-before-deployment}
      DID_LISTING_TOKEN_TTL_SECONDS: ${DID_LISTING_TOKEN_TTL_SECONDS:-900}
      DID_BOOTSTRAP_DSO_DID: ${DID_BOOTSTRAP_DSO_DID:-}
      DID_API_INSTANCE_ID: did-api-2
      PQS_JDBC_URL: jdbc:postgresql://did-postgres:5432/${POSTGRES_DB:-pqs}
      PQS_DB_USER: ${POSTGRES_USER:-pqs}
      PQS_DB_PASSWORD: ${POSTGRES_PASSWORD:-pqs-demo}
    ports:
      - "${DID_API_2_PORT:-42004}:8080"

  did-api-3:
    <<: *did-api
    environment:
      DID_HTTP_PORT: "8080"
      DID_LISTING_HMAC_SECRET: ${DID_LISTING_HMAC_SECRET:-local-demo-only-hmac-secret-change-before-deployment}
      DID_LISTING_TOKEN_TTL_SECONDS: ${DID_LISTING_TOKEN_TTL_SECONDS:-900}
      DID_BOOTSTRAP_DSO_DID: ${DID_BOOTSTRAP_DSO_DID:-}
      DID_API_INSTANCE_ID: did-api-3
      PQS_JDBC_URL: jdbc:postgresql://did-postgres:5432/${POSTGRES_DB:-pqs}
      PQS_DB_USER: ${POSTGRES_USER:-pqs}
      PQS_DB_PASSWORD: ${POSTGRES_PASSWORD:-pqs-demo}
    ports:
      - "${DID_API_3_PORT:-42005}:8080"

  did-api-4:
    <<: *did-api
    environment:
      DID_HTTP_PORT: "8080"
      DID_LISTING_HMAC_SECRET: ${DID_LISTING_HMAC_SECRET:-local-demo-only-hmac-secret-change-before-deployment}
      DID_LISTING_TOKEN_TTL_SECONDS: ${DID_LISTING_TOKEN_TTL_SECONDS:-900}
      DID_BOOTSTRAP_DSO_DID: ${DID_BOOTSTRAP_DSO_DID:-}
      DID_API_INSTANCE_ID: did-api-4
      PQS_JDBC_URL: jdbc:postgresql://did-postgres:5432/${POSTGRES_DB:-pqs}
      PQS_DB_USER: ${POSTGRES_USER:-pqs}
      PQS_DB_PASSWORD: ${POSTGRES_PASSWORD:-pqs-demo}
    ports:
      - "${DID_API_4_PORT:-42006}:8080"

  bft-reader-api:
    build: ./bft-reader/java-api
    environment:
      BFT_READER_HTTP_PORT: "8080"
      BFT_DID_REGISTRY_URL: http://did-api-1:8080/v1/dids/dso
      BFT_ORIGIN_MAP: localhost:42003=http://did-api-1:8080,localhost:42004=http://did-api-2:8080,localhost:42005=http://did-api-3:8080,localhost:42006=http://did-api-4:8080
      BFT_CONNECT_TIMEOUT: ${BFT_CONNECT_TIMEOUT:-2s}
      BFT_READ_TIMEOUT: ${BFT_READ_TIMEOUT:-2s}
      BFT_OPERATION_TIMEOUT: ${BFT_OPERATION_TIMEOUT:-3s}
      BFT_MAX_BODY_BYTES: ${BFT_MAX_BODY_BYTES:-1048576}
    depends_on:
      did-api-1:
        condition: service_healthy
      did-api-2:
        condition: service_healthy
      did-api-3:
        condition: service_healthy
      did-api-4:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/q/health/ready"]
      interval: 3s
      timeout: 3s
      retries: 40
    ports:
      - "${BFT_READER_PORT:-42007}:8080"
    networks:
      - did-network

volumes:
  did-artifacts:
  did-postgres-data:

networks:
  did-network:
